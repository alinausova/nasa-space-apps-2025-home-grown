name: CI (API)

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/ci-api.yml'
  push:
    branches: [redesign]
    paths:
      - 'api/**'
      - '.github/workflows/ci-api.yml'

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest -q
